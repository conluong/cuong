<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý người dùng — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<div id="page-loader"><div class="loader-bubbles"><span></span><span></span><span></span><span></span></div></div>

<header class="navbar">
  <div class="container">
    <div style="display:flex; align-items:center; gap:14px;">
      <button class="icon-btn sidebar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span> Ôn Thi THPT <span class="badge badge-admin" style="margin-left:4px;">Admin</span></a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
      <a href="index.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> Về website</a>
      <div id="nav-user" class="dropdown">
        <button class="avatar-btn" data-dropdown-toggle="user-dropdown">
          <div class="avatar" id="nav-avatar">?</div>
          <span id="nav-user-name" style="font-size:.85rem; font-weight:700;"></span>
        </button>
        <div class="dropdown-menu" id="user-dropdown">
          <a href="profile.html"><i class="fa-solid fa-user"></i> Hồ sơ cá nhân</a>
          <hr><button data-logout><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="as-label">Quản trị</div>
    <nav class="admin-nav">
      <a href="admin.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="admin-users.html" class="active"><i class="fa-solid fa-users"></i> Quản lý người dùng</a>
      <a href="admin-documents.html"><i class="fa-solid fa-folder-open"></i> Quản lý tài liệu</a>
    </nav>
    <div class="as-label">Khác</div>
    <nav class="admin-nav">
      <a href="documents.html"><i class="fa-solid fa-eye"></i> Xem website</a>
      <a href="profile.html"><i class="fa-solid fa-user-gear"></i> Tài khoản của tôi</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Quản lý người dùng</h1><p>Xem, khóa/mở khóa và xóa tài khoản người dùng.</p></div>
      <div class="table-search">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--text-faint);"></i>
        <input type="text" id="user-search-input" placeholder="Tìm theo tên hoặc email...">
      </div>
    </div>

    <div class="card table-card">
      <div class="tc-head"><h3>Danh sách người dùng</h3></div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Người dùng</th><th>Email</th><th>Ngày đăng ký</th><th>Đăng nhập gần nhất</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/documents.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
